ain(void) {\n    for(int i=1;i<=10;i++)printf(\"%d \",6*i);\n    return 0;\n}", "output": "6 12 18 24 30 36 42 48 54 60"}, {"title": "Two Dimensional Array Example", "category": "Arrays", "keywords": "2d array matrix", "description": "2D array के चार तत्व प्रिंट करता है।", "code": "#include <stdio.h>\nint main(void) {\n    int a[2][2]={{1,2},{3,4}};for(int i=0;i<2;i++){for(int j=0;j<2;j++)printf(\"%d \",a[i][j]);printf(\"\\n\");}\n    return 0;\n}", "output": "1 2 / 3 4"}, {"title": "Transpose of 2x2 Matrix", "category": "Arrays", "keywords": "matrix transpose rows columns", "description": "2×2 matrix का transpose दिखाता है।", "code": "#include <stdio.h>\nint main(void) {\n    int a[2][2]={{1,2},{3,4}};for(int j=0;j<2;j++){for(int i=0;i<2;i++)printf(\"%d \",a[i][j]);printf(\"\\n\");}\n    return 0;\n}", "output": "1 3 / 2 4"}, {"title": "Count Vowels in String", "category": "Strings", "keywords": "string count vowels", "description": "string में vowel अक्षरों की संख्या गिनता है।", "code": "#include <stdio.h>\nint main(void) {\n    char s[]=\"education\";int count=0;for(int i=0;s[i];i++)if(s[i]=='a'||s[i]=='e'||s[i]=='i'||s[i]=='o'||s[i]=='u')count++;printf(\"%d\",count);\n    return 0;\n}", "output": "5"}, {"title": "Compare Two Strings", "category": "Strings", "keywords": "strcmp compare strings", "description": "दो strings बराबर हैं या नहीं, जाँचता है।", "code": "#include <stdio.h>\n#include <string.h>\nint main(void){char a[]=\"cat\",b[]=\"cat\";printf(strcmp(a,b)==0?\"Same\":\"Different\");return 0;}", "output": "Same"}, {"title": "Pointer Arithmetic", "category": "Pointers", "keywords": "pointer increment array", "description": "pointer increment से अगले array तत्व को पढ़ता है।", "code": "#include <stdio.h>\nint main(void) {\n    int a[]={10,20,30};int *p=a;printf(\"%d %d\",*p,*(p+1));\n    return 0;\n}", "output": "10 20"}, {"title": "Recursive Fibonacci Term", "category": "Recursion", "keywords": "recursive fibonacci nth term", "description": "recursion से Fi const categories = ['सभी प्रोग्राम', ...new Set(programs.map(p=>p.category))];
let activeCategory='सभी प्रोग्राम'; let selectedId=0; let filtered=[];
const search=document.getElementById('search'), list=document.getElementById('list'), detail=document.getElementById('detail'), count=document.getElementById('count'), chips=document.getElementById('chips');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderChips(){chips.innerHTML='';categories.forEach(cat=>{const b=document.createElement('button');b.className='chip'+(cat===activeCategory?' active':'');b.textContent=cat;b.onclick=()=>{activeCategory=cat;renderChips();renderList()};chips.appendChild(b)})}
function renderList(){const q=search.value.trim().toLowerCase();filtered=programs.map((p,i)=>({...p,id:i})).filter(p=>(activeCategory==='सभी प्रोग्राम'||p.category===activeCategory)&&(!q||(p.title+' '+p.category+' '+p.keywords+' '+p.description).toLowerCase().includes(q)));count.textContent=`${filtered.length} प्रोग्राम मिले · कुल ${programs.length}+ उदाहरण`;list.innerHTML='';if(!filtered.length){list.innerHTML='<div class="empty">कोई प्रोग्राम नहीं मिला। दूसरा शब्द लिखकर देखें, जैसे “table”, “loop” या “factorial”.</div>';return}filtered.forEach(p=>{const b=document.createElement('button');b.className='program-card'+(p.id===selectedId?' selected':'');b.innerHTML=`<strong>${escapeHtml(p.title)}</strong><small>${escapeHtml(p.category)}</small>`;b.onclick=()=>{selectedId=p.id;renderList();renderDetail(p)};list.appendChild(b)});if(!filtered.some(p=>p.id===selectedId)){selectedId=filtered[0].id;renderDetail(filtered[0])}}
function renderDetail(p){detail.innerHTML=`<span class="category">${escapeHtml(p.category)}</span><h2>${escapeHtml(p.title)}</h2><p>${escapeHtml(p.description)}</p><h3 class="section-title">C Language Code</h3><div class="code" id="codeText">${escapeHtml(p.code)}</div><button class="btn copy" id="copyBtn">📋 Copy Code</button><h3 class="section-title">उदाहरण Output</h3><div class="output">${escapeHtml(p.output)}</div><p class="hint">नोट: Output दिए गए उदाहरण के लिए है। कुछ प्रोग्राम में input बदलने पर output भी बदलेगा।</p>`;document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(p.code);document.getElementById('copyBtn').textContent='✓ Code Copy हो गया'}catch(e){const ta=document.createElement('textarea');ta.value=p.code;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();document.getElementById('copyBtn').textContent=ok?'✓ Code Copy हो गया':'कोड को दबाकर चुनें और Copy करें'}}}
search.addEventListener('input',renderList);renderChips();renderList();
</script></body></html>
